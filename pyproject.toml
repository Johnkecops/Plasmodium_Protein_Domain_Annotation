[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmodium-protein-domain-annotation"
version = "1.1.0"
description = "HMM-based protein domain annotation and non-scale-free network analysis for Plasmodium species (UniProt-driven Streamlit app + pipeline)"
requires-python = ">=3.11"
authors = [
    { name = "Arli Aditya Parikesit", email = "arli.parikesit@i3l.ac.id" },
]

[tool.setuptools]
packages = ["SCRIPT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
