[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmodium-protein-domain-annotation"
version = "2.0.0"
description = "Accession-keyed protein domain distribution analysis across Plasmodium reference proteomes (UniProt/InterPro retrieval, avoidance, co-occurrence, pan-core)"
requires-python = ">=3.11"
authors = [
    { name = "Arli Aditya Parikesit", email = "arli.parikesit@i3l.ac.id" },
]

[tool.setuptools]
packages = ["SCRIPT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
