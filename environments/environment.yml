# Exact environment used for every value in the manuscript (macOS arm64, 8 cores).
# Create with: conda env create -f environments/environment.yml
name: plasmodium-domains
channels:
  - conda-forge
dependencies:
  - python=3.11.5
  - pip
  - pip:
      - pandas==3.0.2
      - numpy==1.26.4
      - scipy==1.17.1
      - statsmodels==0.14.0
      - networkx==3.6.1
      - powerlaw==2.0.0
      - matplotlib==3.8.2
      - plotly==6.7.0
      - requests==2.31.0
      - biopython==1.84
      - streamlit==1.57.0
      - pyhmmer==0.12.3
      - python-docx==1.2.0
      - pytest==7.4.0
      - responses==0.13.3
